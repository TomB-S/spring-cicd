name: Workflow CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Sauvegarder le rapport JaCoCo
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: Générer le site Maven
        run: mvn site

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v4
        with:
          name: rapport-checkstyle
          path: target/site/
